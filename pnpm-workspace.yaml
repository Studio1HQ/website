packages:
  - "."

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true

# Security patches for packages other packages depend on, each kept within
# its current major version. The same list is in package.json ("pnpm.overrides")
# for pnpm 9, which the lockfile and Vercel use; newer pnpm reads it here.
overrides:
  brace-expansion@<2: ^1.1.22
  brace-expansion@>=5 <5.0.12: ^5.0.12
  js-yaml@<4: ^3.15.2
  js-yaml@>=4 <4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  postcss-selector-parser@<6.1.5: ^6.1.5
  browserslist@<4.28.7: ^4.28.7
  '@humanfs/node@<0.16.8': ^0.16.8
  baseline-browser-mapping@<2.11.0: ^2.11.0
  source-map-js@<1.2.2: ^1.2.2
  zod@<4.6.6: ^4.6.6
  minimatch@>=10 <11.0.1: ^11.0.8
  minimatch@<4: ^3.1.5
  '@babel/core@<7.29.6': ^7.29.6
