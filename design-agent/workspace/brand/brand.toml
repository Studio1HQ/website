# Studio1: technical content and DevRel agency for DevTools companies. Built from the Studio1 brand kit
# (brand/AI-SYSTEM-PROMPT.md, brand/README.md and public/brand/design-system/ in the website repo).
name = "Studio1"
description = "A developer marketing and DevRel agency for DevTools companies at every stage: technical content, docs, video, launches and community programs. Its look is a designer's working sheet on warm paper."
voice = "An engineer explaining to engineers: plain, specific, short sentences. Numbers and names over adjectives. We is Studio1, you is the reader. No hype words, no emoji, no exclamation marks."
license = "Proprietary"

