backend:
  name: github
  repo: Studio1HQ/website
  branch: main
  base_url: https://www.studio1hq.com
  auth_endpoint: /api/cms/auth

# No local_backend here: this file is served in production. To edit against
# a local checkout, add "local_backend: true" while running npx decap-server,
# and don't commit it.
publish_mode: editorial_workflow
show_preview_links: true

site_url: https://www.studio1hq.com
display_url: https://www.studio1hq.com
logo_url: /assets/site/logo.webp

media_folder: public/blog/uploads
public_folder: /blog/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: blog
    label: Blog
    label_singular: Blog Post
    description: "Use the CMS workflow buttons for Draft, Review, and Publish. The site visibility flag is managed automatically."
    folder: content/blog
    create: true
    delete: false
    extension: mdx
    format: frontmatter
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{date}}"
    preview_path: "blog/{{fields.slug}}"
    editor:
      preview: true
    fields:
      - {
          name: title,
          label: Title,
          widget: string,
          hint: "The headline at the top of the post. If it runs past 60 characters, also fill in SEO Title below.",
        }
      - {
          name: seoTitle,
          label: SEO Title,
          widget: string,
          required: false,
          pattern: ["^.{0,60}$", "Keep the SEO Title to 60 characters or fewer."],
          hint: "Optional. A shorter title for Google results and social cards, 60 characters or fewer, main keyword first. Leave empty when the Title is already short. \" | Studio1\" is added automatically when it fits.",
        }
      - {
          name: slug,
          label: URL Slug,
          widget: string,
          required: true,
          pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers, and hyphens only."],
          hint: "URL path after /blog/. For existing posts, keep this matched to the file name unless you intentionally rename the post file too.",
        }
      - {
          name: description,
          label: SEO Description,
          widget: text,
          pattern: ["^[\\s\\S]{50,160}$", "Write 50 to 160 characters (140 to 160 is best); Google cuts off anything longer."],
          hint: "Aim for 140-160 characters, with the main keyword early. Used for Google snippets, social cards, AI answers, and blog cards.",
        }
      - {
          name: tldrSummary,
          label: TL;DR Summary,
          widget: text,
          required: false,
          hint: "Optional. One short line for the TL;DR card. If empty, the SEO Description is used.",
        }
      - {
          name: tldrBullets,
          label: TL;DR Bullets,
          widget: list,
          required: false,
          min: 0,
          max: 4,
          hint: "Optional. Add 3-4 short bullets for the article TL;DR card. Do not repeat these in the Body.",
          field: { name: bullet, label: Bullet, widget: string },
        }
      - { name: date, label: Published Date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - {
          name: updatedDate,
          label: Updated Date,
          widget: datetime,
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          required: false,
        }
      - {
          name: draft,
          widget: hidden,
          required: false,
          default: false,
        }
      - {
          name: unlisted,
          label: Hide from /blog,
          widget: boolean,
          required: false,
          default: false,
          hint: "Turn on for posts that aren't about Studio1's services. The post stays live at its URL and in search engines, but is left off /blog, the RSS feed, and the latest and next-article links.",
        }
      - {
          name: authors,
          label: Authors,
          widget: list,
          default: ["Studio1 Team"],
          field:
            {
              name: author,
              label: Author,
              widget: string,
              hint: "Examples: Studio1 Team, Amitesh Anand, Arindam Majumder",
            },
        }
      - {
          name: tags,
          label: Tags,
          widget: list,
          hint: "Use 3-6 topical tags for SEO/GEO and article grouping. Add one tag per item (click Add for the next one) rather than a comma-separated line. The first tag is shown as the post's topic label.",
          field: { name: tag, label: Tag, widget: string },
        }
      - {
          name: bannerImage,
          label: Banner Image,
          widget: image,
          required: false,
          choose_url: false,
          hint: "Optional. Shown on the blog card and at the top of the post. Use a 1600x900 (16:9) image in the Studio1 paper style; leave empty to use the generated Studio1 cover.",
        }
      - {
          name: bannerImageAlt,
          label: Banner Image Alt Text,
          widget: string,
          required: false,
          hint: "Optional. Only needed when a banner image is set.",
        }
      - {
          name: body,
          label: Body,
          widget: richtext,
          modes: [raw, rich_text],
          hint: "Paste from Notion in Markdown mode to preserve links and formatting. For images, use the Image block: Upload, then Choose selected. Pasted Notion attachment: URLs are not uploaded files.",
        }
