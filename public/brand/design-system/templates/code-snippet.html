<!DOCTYPE html>
<!-- Studio1 code snippet card for posts, docs and social.
     Paste code into <pre>, keep it under ~18 lines, screenshot the .snippet element. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Studio1 Code Snippet</title>
    <link rel="stylesheet" href="../css/studio1.css" />
    <style>
      body.s1 { margin: 0; padding: 48px; background: var(--s1-neutral-100); }
      .snippet {
        width: 720px;
        border-radius: 10px;
        overflow: hidden;
        background: var(--s1-neutral-950);
        box-shadow: var(--s1-shadow-overlay);
      }
      .snippet-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid var(--s1-neutral-800);
        font-size: 12px;
        color: var(--s1-neutral-400);
      }
      .snippet-file { font-family: var(--s1-font-mono); letter-spacing: 0; color: var(--s1-neutral-300); }
      .snippet-brand { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--s1-neutral-0); }
      .snippet-brand img { width: 16px; height: 16px; }
      .snippet pre { margin: 0; padding: 20px 24px 24px; color: var(--s1-neutral-100); font-size: 14px; line-height: 1.65; }
      /* Syntax colors: neutrals plus the sky accent only */
      .k { color: var(--s1-sky-400); }
      .s { color: var(--s1-sky-200); }
      .c { color: var(--s1-neutral-500); }
      .f { color: var(--s1-neutral-0); font-weight: 500; }
    </style>
  </head>
  <body class="s1">
    <div class="snippet">
      <div class="snippet-bar">
        <span class="snippet-file">client.ts</span>
        <span class="snippet-brand"><img src="../logo/studio1-mark-white.svg" alt="" />Studio1</span>
      </div>
<pre><code><span class="c">// Create a client and fetch your first project</span>
<span class="k">import</span> { Client } <span class="k">from</span> <span class="s">"@acme/sdk"</span>;

<span class="k">const</span> client = <span class="k">new</span> <span class="f">Client</span>({ apiKey: process.env.ACME_KEY });

<span class="k">const</span> project = <span class="k">await</span> client.projects.<span class="f">get</span>(<span class="s">"docs-site"</span>);
console.<span class="f">log</span>(project.name);</code></pre>
    </div>
  </body>
</html>
